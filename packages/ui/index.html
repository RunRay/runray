<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RunRay</title>
    <!-- Inline so the single-file export carries it offline (brand/logo/app-theme). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath fill='%237C5CFF' d='M4 30H228A24 24 0 0 1 228 78H52ZM72 98H168A24 24 0 0 1 168 146H120ZM140 166H228A24 24 0 0 1 228 214H188Z'/%3E%3C/svg%3E"
    />

    <!--
      No-flash theme boot (add-dashboard-extensions D5): stamp the persisted
      "paper" choice before first paint so a reader who chose paper never sees
      a flash of ink. Runs synchronously during parse, ahead of the deferred
      app module. Inlined into both the served shell and the single-file export
      template. Key must match THEME_STORAGE_KEY in src/lib/theme.ts.
    -->
    <script>
      try {
        const theme = localStorage.getItem("runray.theme") || localStorage.getItem("tracepulse.theme");
        if (theme === "paper") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch {
        /* file protocol or locked-down storage — fall back to the ink default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
