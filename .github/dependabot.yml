# Weekly, grouped, so the actions pinned by SHA in .github/workflows keep
# moving without a hand edit per bump. Majors stay separate pull requests.
# Version updates target develop like any other change. Security updates
# ignore target-branch and go to the default branch, which is develop too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the oldest Node major runray supports (engines),
      # not the newest release: newer types would let code call APIs the
      # supported runtime lacks. Raise it together with engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
