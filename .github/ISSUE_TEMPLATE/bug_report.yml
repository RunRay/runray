name: Bug report
description: A session parses oddly, a number looks wrong, a command fails.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: runray --version
      placeholder: "0.1.0-alpha.3"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent wrote the log
      options:
        - Claude Code
        - OpenCode
        - OTLP/JSON import
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version and operating system
      placeholder: "Claude Code 2.x on Windows 11"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you saw, what you expected.
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Sample that reproduces it
      description: |
        A scrubbed excerpt is the fastest route to a fix. `runray export --anonymize --json trace.json`
        strips prompt text and pseudonymizes paths. Please do not paste raw transcripts.
      render: json
